services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: selvbetjening
      POSTGRES_USER: selvbetjening
      POSTGRES_PASSWORD: selvbetjening
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selvbetjening -d selvbetjening"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db_data:
